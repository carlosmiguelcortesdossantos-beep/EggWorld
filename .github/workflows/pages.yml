# Publica o jogo no GitHub Pages a cada push.
# Uma vez só: Settings > Pages > Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main, claude/egg-inc-style-idle-game-53nfuo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Checar sintaxe dos scripts
        run: for f in js/*.js; do node --check "$f"; done
      - name: Simular balanceamento (sanidade)
        run: node tools/sim.mjs 2 0.5 | tail -3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
